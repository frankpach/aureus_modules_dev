server {
  listen 8080;
  server_name _;

  root /var/www/aureus/public;
  index index.php index.html;

  # Healthcheck
  location = /health { return 200 "OK"; }

  # Laravel front controller
  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  # PHP-FPM
  location ~ \.php$ {
    include fastcgi_params;

    # ¡IMPORTANTE!: usar $document_root (no $realpath_root)
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $document_root;

    # Pasar cabeceras del proxy para que Laravel detecte HTTPS/Host reales
    fastcgi_param HTTPS $fcgi_https;
    fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    fastcgi_param HTTP_X_FORWARDED_HOST  $http_host;

    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_read_timeout 120s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
  }

  # Livewire: rutas dinámicas (no existen en disco)
location ^~ /livewire/ {
  try_files $uri /index.php?$query_string;
}

  # Estáticos
  location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|avif|svg|ttf|woff|woff2)$ {
  try_files $uri /index.php?$query_string;
  expires 7d;
  access_log off;
  add_header Cache-Control "public";
}

  client_max_body_size 64m;
}
